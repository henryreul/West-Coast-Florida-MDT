<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a Panel | SFRP CAD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: #ddd;
  font-family: Arial, Helvetica, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
}

.panel {
  width: 420px;
  max-width: calc(100% - 32px);
  background: #111113;
  border: 1px solid #252529;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 15px 45px rgba(0,0,0,.5);
}

h1 {
  margin: 0 0 10px;
  font-size: 25px;
  font-weight: 600;
}

.description {
  margin: 0 0 28px;
  color: #66666d;
  font-size: 14px;
  line-height: 1.5;
}

label {
  display: block;
  margin-bottom: 10px;
  font-size: 15px;
  color: #cfcfd4;
}

label span {
  color: #ff6565;
}

input {
  width: 100%;
  height: 52px;
  padding: 0 16px;

  background: #111113;
  border: 1px solid #3b3b40;
  border-radius: 12px;

  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #4a5dcc;
}

input::placeholder {
  color: #6d6d73;
}

button {
  width: 100%;
  height: 48px;
  margin-top: 18px;

  border: none;
  border-radius: 12px;

  background: #293b92;
  color: #d8d8dc;

  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #3349a8;
}

.error,
.success {
  display: none;
  margin-top: 12px;
  font-size: 13px;
}

.error {
  color: #ff7272;
}

.success {
  color: #72d68f;
}
</style>
</head>

<body>

<div class="panel">

  <h1>Join a panel</h1>

  <p class="description">
    Enter the community ID from a server owner or invite link.
  </p>

  <label>
    Community ID <span>*</span>
  </label>

  <input
    id="communityId"
    type="text"
    placeholder="Community ID"
    autocomplete="off"
  >

  <button onclick="joinPanel()">Join</button>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

</div>

<script>
const ADMIN_CODE = "SFRP-48291";

function joinPanel() {
  const code = document.getElementById("communityId").value.trim();
  const error = document.getElementById("error");
  const success = document.getElementById("success");

  error.style.display = "none";
  success.style.display = "none";

  if (!code) {
    error.textContent = "Please enter a Community ID.";
    error.style.display = "block";
    return;
  }

  if (code === ADMIN_CODE) {
    success.textContent = "Community found.";
    success.style.display = "block";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 700);

    return;
  }

  error.textContent = "Invalid Community ID.";
  error.style.display = "block";
}
</script>

</body>
</html>
