<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DispatchOne | Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --card:#0e0f11;
  --line:#23252a;
  --text:#fff;
  --muted:#8b8d93;
  --blue:#3b57e8;
  --btn:#e9e9eb;
  --btn-hover:#fff;
  --ink:#0b0b0c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
  display:flex;flex-direction:column;
}
.topbar{padding:24px 28px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.02em;text-decoration:none;color:var(--text)}
.logo{display:block;width:26px;height:26px;object-fit:contain}
.brand.sm{font-size:26px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px 72px}
.card{
  width:100%;max-width:420px;padding:36px 30px 32px;
  background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center;
}
h1{margin:0 0 14px;font-size:28px;font-weight:500;letter-spacing:-.01em}
.sub{margin:0 0 30px;color:var(--muted);font-size:16px}
.discord{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 20px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);
  font:500 17px/1 'Outfit',sans-serif;cursor:pointer;transition:background .15s;
}
.discord:hover{background:var(--btn-hover)}
.discord:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.discord:disabled{opacity:.7;cursor:progress}
.discord svg{width:24px;height:24px;flex:none}
.error{min-height:20px;margin:14px 0 0;color:#ff8a8a;font-size:14px}
.legal{margin:26px 0 0;max-width:420px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.legal a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){.discord{transition:none}}
</style>
</head>

<main>

  <section class="card" aria-labelledby="t">
    <h1 id="t">Welcome Back</h1>
    <p class="sub">Please authenticate with Discord to continue.</p>
    <button class="discord" id="signin" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5c1.7.4 2.5 1 3.6 1.9a13 13 0 0 0-5-1.4h-3.6a13 13 0 0 0-5 1.4c1.1-.9 2-1.500 3.700-1.900L8.700 3a19.800 19.800 0 0 0-4.900 1.400C.700 9 .100 13.500.400 18a19.900 19.900 0 0 0 6 3l1.300-2.100a12.800 12.800 0 0 1-2-1l.5-.4a14.200 14.200 0 0 0 12.200 0l.5.400c-.6.400-1.300.7-2 1L18 21a19.800 19.800 0 0 0 6-3c.4-5.200-.700-9.700-3.700-13.600ZM8.300 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400c1.200 0 2.100 1.100 2.100 2.400s-.9 2.400-2.100 2.400Zm7.400 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400c1.200 0 2.100 1.100 2.100 2.400s-.9 2.400-2.100 2.400Z"/></svg>
      <span id="label">Sign in with Discord</span>
    </button>
    <p class="error" id="err" role="alert"></p>
  </section>

  <p class="legal">By clicking continue, you agree to our <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</p>
</main>

<script>
/* ---- Setup: fill these in with your Discord application details ----
   1. Discord Developer Portal -> your app -> OAuth2 -> copy the Client ID.
   2. Add REDIRECT_URI to the app's OAuth2 redirects.
   3. Your backend must handle the callback, exchange the code for a token,
      and check the user's roles/guild membership. */
const CLIENT_ID = "1554241490660888636";
const REDIRECT_URI = "https://your-domain.com/auth/callback";
const SCOPES = "identify guilds.members.read";

const btn = document.getElementById("signin");
const err = document.getElementById("err");
btn.addEventListener("click", () => {
  err.textContent = "";
  if (REDIRECT_URI.includes("your-domain.com")) {
    err.textContent = "Sign-in isn't live yet. The redirect URL still needs to be set to your backend's address.";
    return;
  }
  document.getElementById("label").textContent = "Redirecting to Discord…";
  btn.disabled = true;
  let state = "";
  try {
    state = crypto.randomUUID();
    sessionStorage.setItem("oauth_state", state);
  } catch (e) {}
  const p = new URLSearchParams({
    state: state,
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: SCOPES
  });
  window.location.href = "https://discord.com/oauth2/authorize?" + p.toString();
});
</script>
