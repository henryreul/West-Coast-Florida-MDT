<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>West Coast Florida Public Safety CAD</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #09090b;
  color: #dedee3;
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font-family: inherit;
}


/* =========================================================
   JOIN PAGE
========================================================= */

#joinPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.join-panel {
  width: 420px;
  max-width: calc(100% - 32px);
  background: #111113;
  border: 1px solid #252529;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 15px 45px rgba(0,0,0,.5);
}

.join-panel h1 {
  margin: 0 0 10px;
  font-size: 25px;
  font-weight: 600;
  color: #f1f1f3;
}

.description {
  margin: 0 0 28px;
  color: #66666d;
  font-size: 14px;
  line-height: 1.5;
}

.join-panel label {
  display: block;
  margin-bottom: 10px;
  font-size: 15px;
  color: #cfcfd4;
}

.join-panel label span {
  color: #ff6565;
}

.join-panel input {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  background: #111113;
  border: 1px solid #3b3b40;
  border-radius: 12px;
  color: white;
  font-size: 15px;
  outline: none;
}

.join-panel input:focus {
  border-color: #4a5dcc;
}

.join-panel input::placeholder {
  color: #6d6d73;
}

.join-submit {
  width: 100%;
  height: 48px;
  margin-top: 18px;
  border: 0;
  border-radius: 12px;
  background: #293b92;
  color: #d8d8dc;
  font-size: 15px;
  cursor: pointer;
}

.join-submit:hover {
  background: #3349a8;
}

.error,
.success {
  display: none;
  margin-top: 12px;
  font-size: 13px;
}

.error {
  color: #ff7272;
}

.success {
  color: #72d68f;
}


/* =========================================================
   CAD HOME
========================================================= */

#cadPage {
  display: none;
  min-height: 100vh;
  background: #09090b;
}

.cad-header {
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 28px;
  border-bottom: 1px solid #202024;
  background: #0c0c0e;
}

.cad-logo {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.4px;
  color: #f1f1f3;
}

.cad-main {
  width: min(1050px, calc(100% - 40px));
  margin: auto;
  padding: 45px 0 70px;
}

.section {
  margin-bottom: 42px;
}

.section-title {
  margin: 0 0 17px;
  font-size: 20px;
  font-weight: 600;
  color: #eeeeef;
}

.server-card {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  padding: 23px;
  background: #111113;
  border: 1px solid #242428;
  border-radius: 15px;
}

.server-info {
  display: flex;
  align-items: center;
  gap: 16px;
}

.server-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: #1d1d21;
  border: 1px solid #303036;
  border-radius: 12px;
  color: #d5d5d9;
  font-size: 18px;
  font-weight: 700;
}

.server-name {
  margin: 0 0 6px;
  font-size: 17px;
  font-weight: 600;
  color: #ededf0;
}

.server-status {
  margin: 0;
  font-size: 13px;
  color: #6f6f76;
}

.server-actions {
  display: flex;
  gap: 9px;
}

.server-actions button {
  height: 40px;
  padding: 0 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
}

.join-button {
  background: #293b92;
  border: 0;
  color: #e1e3f5;
}

.manage-button {
  background: #19191c;
  border: 1px solid #303036;
  color: #c7c7cb;
}

.departments-card {
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  background: #111113;
  border: 1px solid #242428;
  border-radius: 15px;
}

.empty-icon {
  width: 46px;
  height: 46px;
  margin: auto auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: #1a1a1d;
  border: 1px solid #2a2a2f;
  color: #77777e;
}

.empty-title {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 600;
}

.empty-description {
  margin: 0;
  color: #66666d;
  font-size: 14px;
}


/* =========================================================
   MANAGEMENT PAGE
========================================================= */

#managePage {
  display: none;
  min-height: 100vh;
  background: #0d0d0f;
}

.manage-layout {
  min-height: 100vh;
  display: flex;
}


/* SIDEBAR */

.sidebar {
  width: 308px;
  min-height: 100vh;
  flex-shrink: 0;
  background: #101012;
  border-right: 1px solid #242428;
  padding: 16px 7px;
}

.sidebar-top {
  height: 68px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.panel-information {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.panel-icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 8px;
  background: #222328;
  border: 1px solid #36373c;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f0f0f2;
  font-size: 15px;
  font-weight: 700;
}

.panel-name {
  min-width: 0;
}

.panel-name strong {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: #c8c8cc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.panel-name span {
  display: block;
  margin-top: 3px;
  font-size: 12px;
  color: #68686f;
}

.sidebar-arrows {
  color: #77777e;
  font-size: 18px;
  line-height: 14px;
}


/* SIDEBAR ITEMS */

.sidebar-section {
  margin-top: 4px;
}

.sidebar-item {
  width: 100%;
  height: 45px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 13px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #c8c8cc;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}

.sidebar-item:hover {
  background: #18181b;
}

.sidebar-item.active {
  background: #242327;
  color: #f1f1f3;
}

.sidebar-icon {
  width: 18px;
  text-align: center;
  color: #a4a4aa;
  font-size: 17px;
}

.sidebar-item.active .sidebar-icon {
  color: #5570ff;
}

.sidebar-chevron {
  margin-left: auto;
  color: #9b9ba1;
  font-size: 18px;
}


/* MANAGEMENT CONTENT */

.manage-content {
  flex: 1;
  min-width: 0;
  padding: 38px 32px 80px;
  overflow-x: hidden;
}

.manage-container {
  max-width: 1190px;
  margin: 0 auto;
}

.page-heading {
  margin-bottom: 28px;
}

.page-heading h1 {
  margin: 0 0 7px;
  font-size: 29px;
  line-height: 1.2;
  color: #e9e9ec;
  font-weight: 650;
}

.page-heading p {
  margin: 0;
  color: #77777e;
  font-size: 14px;
}


/* MANAGEMENT CARDS */

.setting-card {
  margin-bottom: 16px;
  background: #101012;
  border: 1px solid #252529;
  border-radius: 15px;
  padding: 21px 20px;
}

.setting-card h2 {
  margin: 0 0 7px;
  font-size: 22px;
  font-weight: 600;
  color: #cfcfd3;
}

.setting-card > p {
  margin: 0 0 18px;
  color: #77777e;
  font-size: 14px;
  line-height: 1.45;
}


/* INPUTS */

.setting-input,
.setting-textarea {
  width: 100%;
  background: #0d0d0f;
  border: 1px solid #27272b;
  border-radius: 13px;
  color: #cfcfd3;
  outline: none;
  font-size: 14px;
}

.setting-input {
  height: 40px;
  padding: 0 13px;
}

.setting-textarea {
  min-height: 98px;
  padding: 13px;
  resize: vertical;
}

.setting-input:focus,
.setting-textarea:focus {
  border-color: #3d54d8;
}


/* DISCORD ALERT */

.discord-alert {
  margin: 0 0 16px;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #0b1d49;
  border: 1px solid #3c5ed4;
  border-radius: 14px;
}

.discord-alert-icon {
  color: #6278ff;
  font-size: 17px;
}

.discord-alert-text {
  flex: 1;
}

.discord-alert-title {
  margin-bottom: 5px;
  font-size: 14px;
  color: #a6afd0;
}

.discord-alert-description {
  font-size: 13px;
  color: #656d8e;
}

.discord-button {
  height: 34px;
  padding: 0 17px;
  border: 0;
  border-radius: 8px;
  background: #4b62d9;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}


/* TOGGLE */

.approval-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  padding-top: 2px;
}

.approval-title {
  margin-bottom: 5px;
  color: #c6c6ca;
  font-size: 14px;
}

.approval-description {
  color: #66666d;
  font-size: 13px;
}

.toggle {
  width: 51px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 30px;
  border: 0;
  background: #303036;
  position: relative;
  cursor: pointer;
}

.toggle::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: .18s ease;
}

.toggle.on {
  background: #4c61d8;
}

.toggle.on::after {
  left: 25px;
}


/* BACK BUTTON */

.back-button {
  margin-bottom: 25px;
  height: 36px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid #2c2c31;
  background: #171719;
  color: #aaaab0;
  cursor: pointer;
}

.back-button:hover {
  background: #202024;
}


/* MOBILE */

@media (max-width: 850px) {

  .sidebar {
    width: 235px;
  }

  .manage-content {
    padding: 28px 20px 60px;
  }

}

@media (max-width: 650px) {

  .sidebar {
    display: none;
  }

  .manage-content {
    padding: 22px 14px 50px;
  }

  .page-heading h1 {
    font-size: 25px;
  }

  .setting-card {
    padding: 18px;
  }

  .discord-alert {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .discord-button {
    margin-left: 31px;
  }

  .server-card {
    flex-direction: column;
    align-items: stretch;
  }

  .server-actions {
    width: 100%;
  }

  .server-actions button {
    flex: 1;
  }
}
</style>
</head>

<body>


<!-- =======================================================
     JOIN PAGE
======================================================= -->

<div id="joinPage">

  <div class="join-panel">

    <h1>Join a panel</h1>

    <p class="description">
      Enter the community ID from a server owner or invite link.
    </p>

    <label>
      Community ID <span>*</span>
    </label>

    <input
      id="communityId"
      type="text"
      placeholder="Community ID"
      autocomplete="off"
    >

    <button
      class="join-submit"
      onclick="joinPanel()">
      Join
    </button>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

  </div>

</div>


<!-- =======================================================
     CAD HOME
======================================================= -->

<div id="cadPage">

  <header class="cad-header">

    <div class="cad-logo">
      WCFRP
    </div>

  </header>


  <main class="cad-main">

    <section class="section">

      <h2 class="section-title">
        My Servers
      </h2>

      <div class="server-card">

        <div class="server-info">

          <div class="server-icon">
            W
          </div>

          <div>

            <p class="server-name">
              West Coast Florida Public Safety
            </p>

            <p class="server-status">
              0 in CAD
            </p>

          </div>

        </div>

        <div class="server-actions">

          <button
            class="join-button"
            onclick="joinCAD()">
            Join CAD
          </button>

          <button
            class="manage-button"
            onclick="openManage()">
            Manage
          </button>

        </div>

      </div>

    </section>


    <section class="section">

      <h2 class="section-title">
        My Departments
      </h2>

      <div class="departments-card">

        <div>

          <div class="empty-icon">
            —
          </div>

          <p class="empty-title">
            No Departments
          </p>

          <p class="empty-description">
            You aren't currently assigned to any departments.
          </p>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- =======================================================
     MANAGEMENT PAGE
======================================================= -->

<div id="managePage">

  <div class="manage-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <div class="panel-information">

          <div class="panel-icon">
            W
          </div>

          <div class="panel-name">

            <strong>
              West Coast Florida Public Safety
            </strong>

            <span>
              Switch panel
            </span>

          </div>

        </div>

        <div class="sidebar-arrows">
          ‹<br>›
        </div>

      </div>


      <div class="sidebar-section">

        <button class="sidebar-item">

          <span class="sidebar-icon">♧</span>
          <span>Modules</span>
          <span class="sidebar-chevron">›</span>

        </button>


        <button
          class="sidebar-item active"
          onclick="selectSidebar(this, '
