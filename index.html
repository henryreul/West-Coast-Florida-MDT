<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SFRP CAD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: #ddd;
  font-family: Arial, Helvetica, sans-serif;
}

/* JOIN PAGE */

#joinPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.join-panel {
  width: 420px;
  max-width: calc(100% - 32px);
  background: #111113;
  border: 1px solid #252529;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 15px 45px rgba(0,0,0,.5);
}

.join-panel h1 {
  margin: 0 0 10px;
  font-size: 25px;
  font-weight: 600;
  color: #f1f1f3;
}

.description {
  margin: 0 0 28px;
  color: #66666d;
  font-size: 14px;
  line-height: 1.5;
}

label {
  display: block;
  margin-bottom: 10px;
  font-size: 15px;
  color: #cfcfd4;
}

label span {
  color: #ff6565;
}

input {
  width: 100%;
  height: 52px;
  padding: 0 16px;

  background: #111113;
  border: 1px solid #3b3b40;
  border-radius: 12px;

  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #4a5dcc;
}

input::placeholder {
  color: #6d6d73;
}

.join-submit {
  width: 100%;
  height: 48px;
  margin-top: 18px;

  border: none;
  border-radius: 12px;

  background: #293b92;
  color: #d8d8dc;

  font-size: 15px;
  cursor: pointer;
}

.join-submit:hover {
  background: #3349a8;
}

.error,
.success {
  display: none;
  margin-top: 12px;
  font-size: 13px;
}

.error {
  color: #ff7272;
}

.success {
  color: #72d68f;
}


/* CAD PAGE */

#cadPage {
  display: none;
  min-height: 100vh;
  background: #09090b;
}

header {
  height: 70px;
  width: 100%;

  display: flex;
  align-items: center;

  padding: 0 28px;

  border-bottom: 1px solid #202024;
  background: #0c0c0e;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.4px;
  color: #f1f1f3;
}

main {
  width: min(1050px, calc(100% - 40px));
  margin: 0 auto;
  padding: 45px 0 70px;
}

.section {
  margin-bottom: 42px;
}

.section-title {
  margin: 0 0 17px;
  font-size: 20px;
  font-weight: 600;
  color: #eeeeef;
}

.server-card {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 25px;

  padding: 23px;

  background: #111113;
  border: 1px solid #242428;
  border-radius: 15px;
}

.server-info {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.server-icon {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  background: #1d1d21;
  border: 1px solid #303036;
  border-radius: 12px;

  color: #d5d5d9;
  font-size: 18px;
  font-weight: 700;
}

.server-name {
  margin: 0 0 6px;
  font-size: 17px;
  font-weight: 600;
  color: #ededf0;
}

.server-status {
  margin: 0;
  font-size: 13px;
  color: #6f6f76;
}

.server-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}

.server-actions button {
  height: 40px;
  padding: 0 18px;
  border-radius: 9px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}

.join-button {
  background: #293b92;
  border: none;
  color: #e1e3f5;
}

.join-button:hover {
  background: #3449a8;
}

.manage-button {
  background: #19191c;
  border: 1px solid #303036;
  color: #c7c7cb;
}

.manage-button:hover {
  background: #222226;
}

.departments-card {
  min-height: 240px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 40px;

  background: #111113;
  border: 1px solid #242428;
  border-radius: 15px;
}

.empty-state {
  max-width: 420px;
}

.empty-icon {
  width: 46px;
  height: 46px;

  margin: 0 auto 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: #1a1a1d;
  border: 1px solid #2a2a2f;

  color: #77777e;
  font-size: 18px;
}

.empty-title {
  margin: 0 0 8px;

  font-size: 17px;
  font-weight: 600;

  color: #dddddf;
}

.empty-description {
  margin: 0;

  font-size: 14px;
  line-height: 1.5;

  color: #66666d;
}


/* MOBILE */

@media (max-width: 650px) {

  header {
    height: 62px;
    padding: 0 18px;
  }

  .logo {
    font-size: 19px;
  }

  main {
    width: calc(100% - 24px);
    padding: 30px 0 50px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-title {
    font-size: 18px;
  }

  .server-card {
    flex-direction: column;
    align-items: stretch;
  }

  .server-actions {
    width: 100%;
  }

  .server-actions button {
    flex: 1;
  }

  .departments-card {
    min-height: 210px;
    padding: 30px 20px;
  }
}
</style>
</head>

<body>


<!-- ========================= -->
<!-- JOIN PAGE -->
<!-- ========================= -->

<div id="joinPage">

  <div class="join-panel">

    <h1>Join a panel</h1>

    <p class="description">
      Enter the community ID from a server owner or invite link.
    </p>

    <label>
      Community ID <span>*</span>
    </label>

    <input
      id="communityId"
      type="text"
      placeholder="Community ID"
      autocomplete="off"
    >

    <button
      class="join-submit"
      onclick="joinPanel()">
      Join
    </button>

    <div id="error" class="error"></div>

    <div id="success" class="success"></div>

  </div>

</div>


<!-- ========================= -->
<!-- CAD HOME PAGE -->
<!-- ========================= -->

<div id="cadPage">

  <header>

    <div class="logo">
      SFRP CAD
    </div>

  </header>


  <main>

    <section class="section">

      <h2 class="section-title">
        My Servers
      </h2>


      <div class="server-card">

        <div class="server-info">

          <div class="server-icon">
            S
          </div>

          <div>

            <p class="server-name">
              South Florida Roleplay
            </p>

            <p class="server-status">
              0 in CAD
            </p>

          </div>

        </div>


        <div class="server-actions">

          <button
            class="join-button"
            onclick="joinCAD()">
            Join CAD
          </button>

          <button
            class="manage-button"
            onclick="manageCAD()">
            Manage
          </button>

        </div>

      </div>

    </section>


    <section class="section">

      <h2 class="section-title">
        My Departments
      </h2>


      <div class="departments-card">

        <div class="empty-state">

          <div class="empty-icon">
            —
          </div>

          <p class="empty-title">
            No Departments
          </p>

          <p class="empty-description">
            You aren't currently assigned to any departments.
          </p>

        </div>

      </div>

    </section>

  </main>

</div>


<script>

/*
  ADMIN COMMUNITY CODE
*/

const ADMIN_CODE = "SFRP-48291";


/*
  JOIN PANEL
*/

function joinPanel() {

  const input = document.getElementById("communityId");

  const error = document.getElementById("error");

  const success = document.getElementById("success");

  const code = input.value.trim();


  error.style.display = "none";

  success.style.display = "none";


  if (!code) {

    error.textContent = "Please enter a Community ID.";

    error.style.display = "block";

    return;

  }


  if (code !== ADMIN_CODE) {

    error.textContent = "Invalid Community ID.";

    error.style.display = "block";

    return;

  }


  success.textContent = "Community found.";

  success.style.display = "block";


  setTimeout(function() {

    document.getElementById("joinPage").style.display = "none";

    document.getElementById("cadPage").style.display = "block";

    document.body.style.background = "#09090b";

  }, 500);

}


/*
  CAD BUTTONS
*/

function joinCAD() {

  alert("CAD joining will be connected to the server system.");

}


function manageCAD() {

  alert("Management panel coming soon.");

}

</script>

</body>
</html>
